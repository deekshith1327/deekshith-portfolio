backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "content: create {{collection}} '{{slug}}'"
    update: "content: update {{collection}} '{{slug}}'"
    delete: "content: delete {{collection}} '{{slug}}'"

publish_mode: editorial_workflow
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Project ID", name: "id", widget: "string", hint: "Lowercase unique ID, for example esp32-sensor-car", required: false }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - label: "Project category"
        name: "category"
        widget: "select"
        options: ["Robotics", "Embedded", "Hardware", "Automation", "Other"]
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Cover image", name: "cover", widget: "image" }
      - { label: "Gallery images", name: "gallery", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" } }
      - label: "Links"
        name: "links"
        widget: "object"
        fields:
          - { label: "Live link", name: "live", widget: "string", required: false }
          - { label: "GitHub link", name: "github", widget: "string", required: false }
      - { label: "Case study", name: "caseStudy", widget: "markdown", required: false }
      - { label: "Featured project", name: "featured", widget: "boolean", default: false, required: false }
  - name: "education"
    label: "Education"
    folder: "content/education"
    create: true
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
  - name: "achievements"
    label: "Achievements"
    folder: "content/achievements"
    create: true
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
  - name: "site"
    label: "Profile and Skills"
    files:
      - name: "profile"
        label: "Profile"
        file: "content/profile.json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Initials", name: "initials", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Hero intro", name: "intro", widget: "text" }
          - { label: "Bio", name: "bio", widget: "text" }
          - { label: "Personal philosophy", name: "philosophy", widget: "text" }
          - { label: "Profile photo", name: "photo", widget: "image", required: false }
          - label: "Social links"
            name: "socials"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "GitHub URL", name: "github", widget: "string", required: false }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
              - { label: "Resume file", name: "resume", widget: "file", required: false }
      - name: "skills"
        label: "Skills"
        file: "content/skills/core-skills.json"
        fields:
          - label: "Skills"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Electronics", "Embedded", "Programming", "Professional", "Other"]
              - label: "Level"
                name: "level"
                widget: "select"
                options: ["Foundation", "Learning", "Growing"]
              - { label: "Icon", name: "icon", widget: "string", hint: "A short symbol or emoji" }
              - { label: "Related project IDs", name: "relatedProjects", widget: "list", required: false, field: { label: "Project ID", name: "project", widget: "string" } }
