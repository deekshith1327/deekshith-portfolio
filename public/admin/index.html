<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Portfolio Content Dashboard</title>
    <link rel="preconnect" href="https://identity.netlify.com" />
    <link rel="preconnect" href="https://unpkg.com" />
    <style>
      body { margin: 0; background: #080d17; color: #eff6ff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #cms-loading { display: grid; min-height: 100vh; place-content: center; gap: .75rem; text-align: center; padding: 2rem; }
      #cms-loading h1 { font-size: 1.25rem; margin: 0; }
      #cms-loading p { color: #9fb0c8; margin: 0; }
      .loader { width: 28px; height: 28px; border: 3px solid #1f3a5f; border-top-color: #38bdf8; border-radius: 50%; animation: spin .8s linear infinite; margin: auto; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main id="cms-loading" aria-live="polite">
      <div class="loader" aria-hidden="true"></div>
      <h1>Loading content dashboard</h1>
      <p>Connecting to your portfolio content…</p>
    </main>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
    <script src="https://unpkg.com/decap-cms-app@3.8.1/dist/decap-cms.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        window.setTimeout(function () {
          if (!window.CMS) {
            document.getElementById('cms-loading').innerHTML =
              '<h1>Dashboard could not load</h1><p>Please refresh once. If it still appears, turn off any ad blocker for this site and try again.</p>';
          }
        }, 5000);
      });
    </script>
  </body>
</html>
